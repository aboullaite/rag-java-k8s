spring:
  application:
    name: retriever
  main:
    web-application-type: reactive

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

retriever:
  weaviate-url: ${WEAVIATE_URL:http://weaviate.rag.svc.cluster.local:8080}
  opensearch-url: ${OPENSEARCH_URL:}
  timeout-ms: ${RETRIEVAL_TIMEOUT_MS:500}
  top-k-default: 5
  hybrid-enabled: ${HYBRID_ENABLED:true}
  rerank-enabled: ${RERANK_ENABLED:true}
  retrieve-k: ${RETRIEVE_K:20}

weaviate:
  class-name: Doc
