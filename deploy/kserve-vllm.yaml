apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: rag-llm
  namespace: rag
  annotations:
    serving.knative.dev/progress-deadline: "600s"
spec:
  predictor:
    serviceAccountName: orchestrator
    minReplicas: 1
    maxReplicas: 1
    scaleTarget: 1
    scaleMetric: concurrency
    model:
      runtime: vllm-runtime
      modelFormat:
        name: huggingface
      args:
        - --model
        - google/gemma-3-4b-it
        - --dtype
        - auto
        - --max-model-len
        - "4096"
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
      resources:
        limits:
          nvidia.com/gpu: 1
          cpu: "3"
          memory: 12Gi
        requests:
          cpu: "2"
          memory: 8Gi
